<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Shop')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <h1 class="h3 mb-3">Shop</h1>

    <form class="row g-2 align-items-end mb-4" method="get" th:action="@{/shop}" role="search">
        <div class="col-12 col-md-4">
            <label class="form-label" for="category">Category</label>
            <select class="form-select" id="category" name="category">
                <option value="0">All categories</option>
                <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}"
                        th:selected="${c.categoryId == selectedCategory}">Category</option>
            </select>
        </div>
        <div class="col-12 col-md-5">
            <label class="form-label" for="q">Product name</label>
            <input class="form-control" type="search" id="q" name="q" th:value="${search}" autocomplete="off">
        </div>
        <div class="col-12 col-md-3 d-flex gap-2">
            <button class="btn btn-primary flex-fill" type="submit">Search</button>
            <a class="btn btn-outline-secondary flex-fill" th:href="@{/shop}">Clear</a>
        </div>
    </form>

    <p class="text-secondary" th:if="${products.isEmpty()}">No products found.</p>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3">
        <div class="col" th:each="p : ${products}">
            <article class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h2 class="h5 card-title">
                        <a class="text-decoration-none" th:href="@{/shop/product/{id}(id=${p.productId})}"
                           th:text="${p.productName}">Product</a>
                    </h2>
                    <p class="small text-secondary mb-2">
                        <span th:text="${p.categoryName}">Category</span> ·
                        <span th:text="${p.storeName}">Store</span>
                    </p>
                    <p class="fs-5 fw-semibold mb-1"
                       th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')} + ' ₺'">0.00 ₺</p>
                    <p class="small mb-3">
                        <span class="badge text-bg-secondary" th:if="${p.quantityInStock == 0}">Out of stock</span>
                        <span class="text-secondary" th:if="${p.quantityInStock > 0}"
                              th:text="${p.quantityInStock} + ' in stock'">In stock</span>
                    </p>

                    <form class="mt-auto" method="post" th:action="@{/shop/cart/add}"
                          th:if="${currentUser != null and currentUser.roleName == 'Customer' and p.quantityInStock > 0}">
                        <input type="hidden" name="productId" th:value="${p.productId}">
                        <input type="hidden" name="quantity" value="1">
                        <input type="hidden" name="returnTo"
                               th:value="@{/shop(category=${selectedCategory},q=${search})}">
                        <button class="btn btn-primary w-100" type="submit">Add to cart</button>
                    </form>
                    <a class="btn btn-outline-secondary w-100 mt-auto" th:href="@{/login}"
                       th:if="${currentUser == null and p.quantityInStock > 0}">Log in to buy</a>
                </div>
            </article>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>

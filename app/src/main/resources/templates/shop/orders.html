<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Orders')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <h1 class="h3 mb-3">Your orders</h1>

    <div th:if="${orders.isEmpty()}">
        <p class="text-secondary">You have no orders yet.</p>
        <a class="btn btn-primary" th:href="@{/shop}">Go to shop</a>
    </div>

    <div class="table-responsive" th:unless="${orders.isEmpty()}">
        <table class="table align-middle">
            <thead>
            <tr>
                <th scope="col">Order</th>
                <th scope="col">Date</th>
                <th scope="col">Status</th>
                <th scope="col" class="text-end">Total</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <th scope="row" class="fw-normal">
                    <a th:href="@{/shop/orders/{id}(id=${order.orderId})}" th:text="'#' + ${order.orderId}">#1</a>
                </th>
                <td class="text-nowrap" th:text="${order.orderDate}">2026-01-01</td>
                <td><span class="badge text-bg-light border" th:text="${order.status}">Pending</span></td>
                <td class="text-end text-nowrap"
                    th:text="${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 2, 'POINT')} + ' ₺'">0.00 ₺</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>

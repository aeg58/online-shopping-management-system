<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${addressId != null ? 'Edit address' : 'Add address'})}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container py-4">
    <div class="product-form-panel">
        <div th:replace="~{fragments/layout :: messages}"></div>

        <p><a th:href="@{/shop/addresses}">Back to addresses</a></p>
        <h1 class="h3 mb-3" th:text="${addressId != null ? 'Edit address' : 'Add address'}">Add address</h1>

        <form method="post" th:object="${form}"
              th:action="${addressId != null} ? @{/shop/addresses/{id}(id=${addressId})} : @{/shop/addresses}">
            <div class="mb-3">
                <label class="form-label" for="title">Title</label>
                <input class="form-control" type="text" id="title" th:field="*{title}" maxlength="50"
                       placeholder="Home, Work" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="addressLine">Address</label>
                <input class="form-control" type="text" id="addressLine" th:field="*{addressLine}" maxlength="255"
                       autocomplete="street-address" required>
            </div>
            <div class="row g-2 mb-3">
                <div class="col-12 col-sm-6">
                    <label class="form-label" for="district">District</label>
                    <input class="form-control" type="text" id="district" th:field="*{district}" maxlength="50" required>
                </div>
                <div class="col-12 col-sm-6">
                    <label class="form-label" for="city">City</label>
                    <input class="form-control" type="text" id="city" th:field="*{city}" maxlength="50"
                           autocomplete="address-level2" required>
                </div>
            </div>
            <div class="row g-2 mb-3">
                <div class="col-12 col-sm-6">
                    <label class="form-label" for="country">Country</label>
                    <input class="form-control" type="text" id="country" th:field="*{country}" maxlength="50"
                           autocomplete="country-name" required>
                </div>
                <div class="col-12 col-sm-6">
                    <label class="form-label" for="postalCode">Postal code (optional)</label>
                    <input class="form-control" type="text" id="postalCode" th:field="*{postalCode}" maxlength="10"
                           autocomplete="postal-code" inputmode="numeric">
                </div>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="defaultAddress" th:field="*{defaultAddress}">
                <label class="form-check-label" for="defaultAddress">Use as my default address</label>
            </div>
            <button class="btn btn-primary w-100" type="submit"
                    th:text="${addressId != null ? 'Save changes' : 'Add address'}">Add address</button>
        </form>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>

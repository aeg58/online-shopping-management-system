<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${addressId != null ? 'Edit address' : 'Add address'})}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container py-4">
    <div class="product-form-panel">
        <div th:replace="~{fragments/layout :: messages}"></div>

        <p><a th:href="@{/shop/addresses}">Back to addresses</a></p>
        <h1 class="h3 mb-3" th:text="${addressId != null ? 'Edit address' : 'Add address'}">Add address</h1>

        <form method="post" th:object="${form}"
              th:action="${addressId != null} ? @{/shop/addresses/{id}(id=${addressId})} : @{/shop/addresses}">
            <div class="mb-3">
                <label class="form-label" for="title">Title</label>
                <input class="form-control" type="text" id="title" th:field="*{title}" maxlength="50"
                       placeholder="Home, Work" required>
            </div>
            <div class="row g-2 mb-3">
                <div class="col-12 col-sm-6">
                    <label class="form-label" for="city">City</label>
                    <select class="form-select" id="city" name="city" required data-address-city>
                        <option value="">Choose a city</option>
                        <option th:each="p : ${provinces}" th:value="${p.name}" th:text="${p.name}"
                                th:attr="data-id=${p.id}" th:selected="${p.name == form.city}">City</option>
                    </select>
                </div>
                <div class="col-12 col-sm-6">
                    <label class="form-label" for="district">District</label>
                    <select class="form-select" id="district" name="district" required data-address-district>
                        <option value="">Choose a district</option>
                        <option th:each="d : ${districts}" th:value="${d.name}" th:text="${d.name}"
                                th:selected="${d.name == form.district}">District</option>
                    </select>
                </div>
            </div>
            <div class="row g-2 mb-3">
                <div class="col-12 col-sm-8">
                    <label class="form-label" for="neighborhood">Neighborhood or village</label>
                    <select class="form-select" id="neighborhood" name="neighborhood" required data-address-place>
                        <option value="">Choose a neighborhood</option>
                        <option th:each="x : ${places}" th:value="${x.label()}" th:text="${x.label()}"
                                th:attr="data-postal=${x.postalCode}" th:selected="${x.label() == form.neighborhood}">Place</option>
                    </select>
                </div>
                <div class="col-12 col-sm-4">
                    <label class="form-label" for="postalCode">Postal code</label>
                    <input class="form-control" type="text" id="postalCode" th:value="${postalCode}"
                           readonly tabindex="-1" aria-describedby="postalHelp" data-address-postal>
                    <div class="form-text" id="postalHelp">Filled in from the neighborhood.</div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="street">Street and building number</label>
                <input class="form-control" type="text" id="street" name="street" th:value="${form.street}"
                       maxlength="200" placeholder="15. Sk. No:9 D:3" autocomplete="address-line1" required>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="defaultAddress" th:field="*{defaultAddress}">
                <label class="form-check-label" for="defaultAddress">Use as my default address</label>
            </div>
            <button class="btn btn-primary w-100" type="submit"
                    th:text="${addressId != null ? 'Save changes' : 'Add address'}">Add address</button>
        </form>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
<script th:src="@{/js/address-form.js}" defer></script>
</body>
</html>

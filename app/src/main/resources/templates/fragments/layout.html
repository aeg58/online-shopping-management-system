<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · OnlineShop'">OnlineShop</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header th:fragment="navbar" class="border-bottom bg-white">
    <nav class="navbar navbar-expand-lg" aria-label="Main menu">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">OnlineShop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu"
                    aria-controls="mainMenu" aria-expanded="false" aria-label="Toggle menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainMenu">
                <ul class="navbar-nav me-auto" th:if="${currentUser != null}">
                    <li class="nav-item" th:if="${currentUser.roleName == 'Admin'}">
                        <a class="nav-link" th:href="@{/admin}"
                           th:attr="aria-current=${currentPath == '/admin'} ? 'page' : null">Dashboard</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser.roleName == 'Seller'}">
                        <a class="nav-link" th:href="@{/seller}"
                           th:attr="aria-current=${currentPath == '/seller'} ? 'page' : null">Dashboard</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser.roleName == 'Customer'}">
                        <a class="nav-link" th:href="@{/shop}"
                           th:attr="aria-current=${currentPath == '/shop'} ? 'page' : null">Shop</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser.roleName == 'Customer'}">
                        <a class="nav-link" th:href="@{/shop/cart}"
                           th:attr="aria-current=${currentPath == '/shop/cart'} ? 'page' : null">Cart</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser.roleName == 'Customer'}">
                        <a class="nav-link" th:href="@{/shop/orders}"
                           th:attr="aria-current=${currentPath == '/shop/orders'} ? 'page' : null">Orders</a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item" th:if="${currentUser == null}">
                        <a class="nav-link" th:href="@{/login}"
                           th:attr="aria-current=${currentPath == '/login'} ? 'page' : null">Login</a>
                    </li>
                    <th:block th:if="${currentUser != null}">
                        <li class="nav-item">
                            <span class="navbar-text me-lg-3">
                                <span th:text="${currentUser.username}">username</span>
                                <span class="badge text-bg-light border ms-1" th:text="${currentUser.roleName}">Role</span>
                            </span>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/logout}">Logout</a>
                        </li>
                    </th:block>
                </ul>
            </div>
        </div>
    </nav>
</header>

<div th:fragment="messages">
    <div class="alert alert-success" role="status" th:if="${successMessage}" th:text="${successMessage}">Saved</div>
    <div class="alert alert-danger" role="alert" th:if="${errorMessage}" th:text="${errorMessage}">Error</div>
</div>

<script th:fragment="scripts"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Account fields shared by the customer and the seller form (Users table). -->
<th:block th:fragment="account">
    <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input class="form-control" type="text" id="username" th:field="*{username}" maxlength="50"
               pattern="[A-Za-z0-9_.]+" autocomplete="username" autocapitalize="none" autocorrect="off"
               spellcheck="false" aria-describedby="usernameHelp" required>
        <div class="form-text" id="usernameHelp">Letters, numbers, dots and underscores.</div>
    </div>
    <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" type="email" id="email" th:field="*{email}" maxlength="100"
               autocomplete="email" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="row g-2 mb-3">
        <div class="col-12 col-sm-6">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password" minlength="6"
                   autocomplete="new-password" aria-describedby="passwordHelp" required>
            <div class="form-text" id="passwordHelp">At least 6 characters.</div>
        </div>
        <div class="col-12 col-sm-6">
            <label class="form-label" for="confirmPassword">Repeat password</label>
            <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" minlength="6"
                   autocomplete="new-password" required>
        </div>
    </div>
</th:block>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${product != null ? 'Edit product' : 'Add product'})}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container py-4">
    <div class="product-form-panel">
        <div th:replace="~{fragments/layout :: messages}"></div>

        <p><a th:href="@{/seller/products}">Back to my products</a></p>
        <h1 class="h3 mb-3" th:text="${product != null ? 'Edit product' : 'Add product'}">Add product</h1>

        <form method="post"
              th:action="${product != null} ? @{/seller/products/{id}(id=${product.productId})} : @{/seller/products}">

            <div class="mb-3" th:if="${product != null}">
                <p class="fw-semibold mb-0" th:text="${product.productName}">Product</p>
                <p class="small text-secondary mb-0" th:text="${product.categoryName}">Category</p>
            </div>

            <th:block th:if="${product == null}">
                <div class="mb-3">
                    <label class="form-label" for="categoryId">Category</label>
                    <select class="form-select" id="categoryId" name="categoryId" required>
                        <option value="">Choose a category</option>
                        <option th:each="c : ${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}"
                                th:selected="${form.categoryId == c.categoryId.toString()}">Category</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="productName">Product name</label>
                    <input class="form-control" type="text" id="productName" name="productName" maxlength="150"
                           th:value="${form.productName}" autocomplete="off" required>
                </div>
            </th:block>

            <div class="mb-3">
                <label class="form-label" for="description">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3" maxlength="1000"
                          th:text="${form.description}"></textarea>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label class="form-label" for="price">Price (₺)</label>
                    <input class="form-control" type="number" id="price" name="price" step="0.01" inputmode="decimal"
                           th:value="${form.price}" required>
                </div>
                <div class="col-6">
                    <label class="form-label" for="stock">Stock</label>
                    <input class="form-control" type="number" id="stock" name="stock" step="1" inputmode="numeric"
                           th:value="${form.stock}" required>
                </div>
            </div>

            <div class="form-check mb-3" th:if="${product != null}">
                <input type="hidden" name="_active" value="on">
                <input class="form-check-input" type="checkbox" id="active" name="active" th:checked="${form.active}">
                <label class="form-check-label" for="active">Show this product in the shop</label>
            </div>

            <button class="btn btn-primary w-100" type="submit"
                    th:text="${product != null ? 'Save changes' : 'Add product'}">Add product</button>
        </form>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>

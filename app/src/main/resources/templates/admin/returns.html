<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Returns')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <h1 class="h3 mb-3">Return requests</h1>

    <p class="text-secondary" th:if="${returns.isEmpty()}">No return requests.</p>
    <div class="table-responsive" th:unless="${returns.isEmpty()}">
        <table class="table align-middle">
            <thead>
            <tr>
                <th scope="col">Product</th>
                <th scope="col" class="text-end">Qty</th>
                <th scope="col" class="d-none d-md-table-cell">Reason</th>
                <th scope="col" class="d-none d-lg-table-cell">Date</th>
                <th scope="col">Status</th>
                <th scope="col" class="d-none d-sm-table-cell text-end">Refund</th>
                <th scope="col" class="text-end">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${returns}">
                <th scope="row" class="fw-normal">
                    <span th:text="${r.productName}">Product</span>
                    <a class="d-block small" th:href="@{/admin/orders/{id}(id=${r.orderId})}"
                       th:text="'Order #' + ${r.orderId}">Order #1</a>
                    <span class="d-block d-md-none small text-secondary" th:text="${r.reason}">Reason</span>
                </th>
                <td class="text-end" th:text="${r.quantity}">1</td>
                <td class="d-none d-md-table-cell" th:text="${r.reason}">Reason</td>
                <td class="d-none d-lg-table-cell text-nowrap" th:text="${r.requestDate}">2026-01-01</td>
                <td><span class="badge text-bg-light border" th:text="${r.status}">Requested</span></td>
                <td class="d-none d-sm-table-cell text-end text-nowrap"
                    th:text="${r.refundAmount != null ? #numbers.formatDecimal(r.refundAmount, 1, 'COMMA', 2, 'POINT') + ' ₺' : '-'}">-</td>
                <td class="text-end">
                    <div class="d-flex flex-column flex-sm-row gap-1 justify-content-end" th:if="${r.status == 'Requested'}">
                        <form method="post" th:action="@{/admin/returns/{id}/approve(id=${r.returnId})}">
                            <button class="btn btn-outline-secondary btn-sm w-100" type="submit">Approve</button>
                        </form>
                        <form method="post" th:action="@{/admin/returns/{id}/reject(id=${r.returnId})}">
                            <button class="btn btn-outline-danger btn-sm w-100" type="submit">Reject</button>
                        </form>
                    </div>
                    <form method="post" th:action="@{/admin/returns/{id}/refund(id=${r.returnId})}"
                          th:if="${r.status == 'Approved'}">
                        <button class="btn btn-primary btn-sm" type="submit">Refund</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>

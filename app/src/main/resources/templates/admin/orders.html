<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('All orders')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <h1 class="h3 mb-3">All orders</h1>

    <p class="text-secondary" th:if="${orders.isEmpty()}">No orders yet.</p>
    <div class="table-responsive" th:unless="${orders.isEmpty()}">
        <table class="table align-middle">
            <thead>
            <tr>
                <th scope="col">Order</th>
                <th scope="col" class="d-none d-md-table-cell">Date</th>
                <th scope="col">Customer</th>
                <th scope="col">Status</th>
                <th scope="col" class="text-end">Total</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${orders}">
                <th scope="row" class="fw-normal">
                    <a th:href="@{/admin/orders/{id}(id=${o.orderId})}" th:text="'#' + ${o.orderId}">#1</a>
                </th>
                <td class="d-none d-md-table-cell text-nowrap" th:text="${o.orderDate}">2026-01-01</td>
                <td th:text="${o.customerName}">Name</td>
                <td><span class="badge text-bg-light border" th:text="${o.status}">Paid</span></td>
                <td class="text-end text-nowrap"
                    th:text="${#numbers.formatDecimal(o.totalAmount, 1, 'COMMA', 2, 'POINT')} + ' ₺'">0.00 ₺</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>

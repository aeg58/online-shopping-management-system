<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categories')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
        <h1 class="h3 mb-0">Categories</h1>
        <a class="btn btn-primary" th:href="@{/admin/categories/new}">Add category</a>
    </div>

    <div class="table-responsive">
        <table class="table align-middle">
            <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col" class="d-none d-sm-table-cell">Description</th>
                <th scope="col" class="text-end">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${categories}">
                <th scope="row" class="fw-normal" th:text="${c.categoryName}">Name</th>
                <td class="d-none d-sm-table-cell" th:text="${c.description != null ? c.description : '-'}">-</td>
                <td class="text-end">
                    <a class="btn btn-outline-secondary btn-sm"
                       th:href="@{/admin/categories/{id}/edit(id=${c.categoryId})}">Edit</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>

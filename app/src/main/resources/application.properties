spring.application.name=osms-app
server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=shoppingmngmntsystem;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.sql.init.mode=never
spring.thymeleaf.cache=false

server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# Product photos uploaded by sellers (the app checks the 2 MB limit; bigger files are refused earlier)
osms.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.tomcat.max-swallow-size=20MB

# Optional local overrides, kept out of version control
spring.config.import=optional:file:./application-local.properties

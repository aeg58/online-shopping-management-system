spring.application.name=osms-app
server.port=8080

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=shoppingmngmntsystem;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.sql.init.mode=never
spring.thymeleaf.cache=false

# Optional local overrides, kept out of version control
spring.config.import=optional:file:./application-local.properties

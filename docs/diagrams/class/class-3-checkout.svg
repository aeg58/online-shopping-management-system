      <title id="class-3-checkout-title">Placing an order · class diagram</title>
      <desc id="class-3-checkout-desc">CheckoutController calls OrderService.placeOrder, which runs as one transaction and uses the cart, inventory, coupon, order and payment repositories.</desc>
